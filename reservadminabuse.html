<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin Abuse Finalizo</title>
    <link rel="icon" href="https://www.svgrepo.com/show/503173/apple-logo.svg" type="image/svg+xml">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #050505;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .iphone-unavailable-banner {
            text-align: center;
            padding: 30px 35px;
            background: rgba(0, 0, 0, 0.8);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            max-width: 400px;
        }
        .iphone-unavailable-banner p {
            color: #fff;
            font-size: 16px;
            line-height: 1.6;
            margin: 0 0 24px 0;
            font-weight: 500;
        }
        .unlock-rgb-btn {
            display: inline-block;
            padding: 16px 40px;
            font-size: 16px;
            font-weight: 700;
            color: #fff;
            text-decoration: none;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: transform 0.2s, box-shadow 0.3s;
            animation: rgbBorderPulse 2s ease-in-out infinite;
        }
        .unlock-rgb-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, #ff0000, #ff8000, #ffff00, #00ff00, #00ffff, #0080ff, #8000ff, #ff0080, #ff0000);
            background-size: 400% 100%;
            border-radius: 25px;
            z-index: -2;
            animation: rgbGradient 3s linear infinite;
        }
        .unlock-rgb-btn::after {
            content: '';
            position: absolute;
            inset: 3px;
            background: rgba(0, 0, 0, 0.85);
            border-radius: 22px;
            z-index: -1;
        }
        .unlock-rgb-btn span {
            position: relative;
            z-index: 1;
            color: #fff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
        }
        .unlock-rgb-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 0 35px rgba(255, 0, 255, 0.8), 0 0 70px rgba(0, 255, 255, 0.5), 0 0 100px rgba(255, 255, 0, 0.3);
        }
        .unlock-rgb-btn:active {
            transform: scale(0.95);
        }
        @keyframes rgbGradient {
            0% { background-position: 0% 50%; }
            100% { background-position: 400% 50%; }
        }
        @keyframes rgbBorderPulse {
            0%, 100% { box-shadow: 0 0 15px rgba(255, 0, 0, 0.6); }
            25% { box-shadow: 0 0 20px rgba(0, 255, 0, 0.6); }
            50% { box-shadow: 0 0 25px rgba(0, 100, 255, 0.6); }
            75% { box-shadow: 0 0 20px rgba(255, 0, 255, 0.6); }
        }
    </style>
</head>
<body>
    <div class="iphone-unavailable-banner">
        <p>iPhone no disponible. Vuelve para el próximo Admin Abuse para desbloquear. Presiona el botón:</p>
        <a href="index.html" class="unlock-rgb-btn"><span>Desbloquear</span></a>
    </div>
</body>
</html>
