<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin Abuse WTC title>
    <link rel="icon" href="https://www.svgrepo.com/show/503173/apple-logo.svg" type="image/svg+xml">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Inter:wght@300;400;600&display=swap');
        :root{--glass-bg:rgba(255,255,255,0.15);--glass-border:rgba(255,255,255,0.2);--app-bg:#f2f2f7;--app-text:#000;--accent:#007aff;--list-bg:#fff;--border-color:#e5e5ea}
        .iphone-frame.dark-mode{--app-bg:#000;--app-text:#fff;--glass-bg:rgba(30,30,30,0.6);--list-bg:#1c1c1e;--border-color:#38383a}
        *{box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}
        body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;background:#000;height:100vh;display:flex;justify-content:center;align-items:center;overflow:hidden}

        /* FONDO NEGRO PARTÍCULAS */
        #bgCanvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}

        #scaler{transition:transform .1s;display:flex;gap:20px;align-items:center;position:relative;z-index:1}
        .iphone-frame{width:380px;height:800px;background:#000;border-radius:55px;position:relative;box-shadow:0 0 0 12px #1a1a1a,0 0 0 14px #4a4a4a,0 20px 50px rgba(0,0,0,.5);overflow:hidden;z-index:10;transition:background .3s}

        /* WELCOME */
        #welcomeScreen{position:absolute;top:0;left:0;width:100%;height:100%;background:white;z-index:5000;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;transition:transform .8s cubic-bezier(.6,-.28,.735,.045)}
        #welcomeText{font-family:'Dancing Script',cursive;font-size:60px;font-weight:700;opacity:0;transition:opacity 1s;color:black}
        .swipe-hint-text{position:absolute;bottom:50px;font-family:-apple-system,sans-serif;font-weight:500;font-size:16px;opacity:0;animation:fadeUp 2s infinite;color:#888}
        @keyframes fadeUp{0%{opacity:0;transform:translateY(10px)}50%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-10px)}}

        /* ISLA DINÁMICA */
        .notch{position:absolute;top:20px;left:50%;transform:translateX(-50%);width:120px;height:35px;background:#000;border-radius:20px;z-index:6000;transition:all .45s cubic-bezier(.175,.885,.32,1.275);color:white;overflow:hidden;display:flex;align-items:center;justify-content:space-between;padding:0 12px;cursor:pointer}
        .notch.welcome-aura{animation:islandBreathe 3s infinite alternate;box-shadow:0 0 20px 2px rgba(0,122,255,.6),0 0 40px 5px rgba(50,255,100,.3);border:1px solid rgba(255,255,255,.1)}
        @keyframes islandBreathe{0%{box-shadow:0 0 15px 1px rgba(0,122,255,.5),0 0 30px 2px rgba(200,50,255,.2)}100%{box-shadow:0 0 25px 4px rgba(50,200,255,.8),0 0 50px 8px rgba(50,255,100,.4)}}
        .notch.expanded-charge{width:320px;height:120px;border-radius:35px;justify-content:center;background:linear-gradient(135deg,#000,#1a1a2e,#000);border:2px solid #FFD700;flex-direction:column;animation:superChargeGlow 2s infinite alternate}
        @keyframes superChargeGlow{0%{box-shadow:0 0 20px 2px rgba(255,215,0,.6),0 0 40px 4px rgba(255,255,0,.4),inset 0 0 20px rgba(255,215,0,.2)}100%{box-shadow:0 0 30px 4px rgba(255,215,0,.9),0 0 60px 8px rgba(255,215,0,.6),inset 0 0 30px rgba(255,215,0,.3)}}
        .lightning{position:absolute;width:3px;height:30px;background:linear-gradient(to bottom,#FFD700,transparent);opacity:0;animation:lightning 1.5s infinite}
        .lightning:nth-child(1){left:10%;animation-delay:0s}.lightning:nth-child(2){left:30%;animation-delay:.3s}.lightning:nth-child(3){right:30%;animation-delay:.6s}.lightning:nth-child(4){right:10%;animation-delay:.9s}
        @keyframes lightning{0%,100%{opacity:0;transform:translateY(-10px) scaleY(0)}10%{opacity:1;transform:translateY(0) scaleY(1)}20%{opacity:0;transform:translateY(10px) scaleY(.5)}}
        .energy-particle{position:absolute;width:4px;height:4px;background:#FFD700;border-radius:50%;opacity:0;animation:particleFloat 2s infinite}
        @keyframes particleFloat{0%{opacity:0;transform:translateY(20px) scale(0)}50%{opacity:1;transform:translateY(-20px) scale(1)}100%{opacity:0;transform:translateY(-40px) scale(0)}}
        .notch.expanded-faceid{width:160px;height:160px;border-radius:40px;justify-content:center;flex-direction:column}
        .notch.expanded-language{width:280px;height:60px;border-radius:30px;justify-content:center;background:linear-gradient(45deg,#000,#1a1a1a);border:1px solid rgba(255,255,255,.2);box-shadow:0 0 30px rgba(0,122,255,.5)}
        .notch.expanded-music{width:310px;height:72px;border-radius:36px;justify-content:flex-start;padding:0 8px;background:#000;border:1px solid rgba(255,255,255,.08);box-shadow:0 8px 40px rgba(0,0,0,.8)}
        .notch-content{display:none;width:100%;opacity:0;transition:opacity .2s}
        .notch.expanded-charge .charge-ui,.notch.expanded-faceid .faceid-ui,.notch.expanded-language .lang-ui{display:flex;opacity:1;align-items:center;justify-content:center;gap:10px}
        .notch.expanded-music .music-island-ui{display:flex!important;opacity:1!important}
        .music-island-ui{display:none;align-items:center;width:100%;gap:9px;opacity:0;transition:opacity .3s}
        .mi-cover{width:50px;height:50px;border-radius:10px;object-fit:cover;flex-shrink:0;box-shadow:0 2px 12px rgba(0,0,0,.6)}
        .mi-info{flex:1;overflow:hidden}
        .mi-title{font-size:12px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
        .mi-artist{font-size:10px;color:rgba(255,255,255,.5);margin-top:1px}
        .mi-mini-bars{display:flex;align-items:flex-end;gap:2px;height:20px;flex-shrink:0}
        .mi-bar{width:3px;background:#1db954;border-radius:1.5px;animation:miBarDance .6s ease-in-out infinite alternate}
        .mi-bar:nth-child(1){animation-duration:.5s;animation-delay:.0s}.mi-bar:nth-child(2){animation-duration:.7s;animation-delay:.1s}.mi-bar:nth-child(3){animation-duration:.45s;animation-delay:.2s}.mi-bar:nth-child(4){animation-duration:.8s;animation-delay:.05s}.mi-bar:nth-child(5){animation-duration:.55s;animation-delay:.15s}
        @keyframes miBarDance{from{height:3px}to{height:18px}}
        .charge-ui{flex-direction:column;gap:8px!important;position:relative}
        .super-charge-badge{background:linear-gradient(135deg,#FFD700,#FFA500);padding:4px 12px;border-radius:12px;font-size:10px;font-weight:800;color:#000;letter-spacing:1px}
        .charge-percentage{font-size:48px;font-weight:700;color:#FFD700;text-shadow:0 0 20px rgba(255,215,0,.8);line-height:1}
        .charge-watts{font-size:14px;font-weight:600;color:#fff;opacity:.9}
        .globe-spin{animation:spin 2s linear infinite;color:#007aff}
        @keyframes spin{100%{transform:rotate(360deg)}}
        .scan-line{width:50px;height:50px;border:2px solid #007aff;border-radius:10px;position:relative}
        .scan-line::after{content:'';position:absolute;top:0;left:0;width:100%;height:2px;background:#007aff;animation:scan 1.5s infinite}
        @keyframes scan{0%{top:0;opacity:0}50%{opacity:1}100%{top:100%;opacity:0}}

        /* TUTORIAL */
        #tutorialOverlay{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.9);backdrop-filter:blur(20px);z-index:4000;display:none;justify-content:center;align-items:center}
        .tut-card{background:rgba(255,255,255,.1);backdrop-filter:blur(30px);border:1px solid rgba(255,255,255,.2);border-radius:30px;padding:40px;text-align:center;color:white;display:none;max-width:300px}
        .tut-card.active{display:block;animation:fadeIn .5s}
        @keyframes fadeIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
        .tut-btn{background:linear-gradient(135deg,#007aff,#0051d5);color:white;border:none;padding:12px 30px;border-radius:20px;font-size:16px;font-weight:600;cursor:pointer;margin-top:20px}

        /* WALLPAPER/LOCK */
        .wallpaper-layer{position:absolute;top:0;left:0;width:100%;height:100%;z-index:0;background:linear-gradient(135deg,#021B79,#0575E6,#00F260);background-size:400% 400%;animation:gradientAnim 15s ease infinite}
        @keyframes gradientAnim{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
        .lock-screen{position:absolute;top:0;left:0;width:100%;height:100%;z-index:1000;background:linear-gradient(135deg,#021B79,#0575E6,#00F260);background-size:400% 400%;animation:gradientAnim 15s ease infinite;display:flex;flex-direction:column;align-items:center;transition:transform .6s cubic-bezier(.16,1,.3,1)}
        .lock-screen.unlocked{transform:translateY(-100%)}
        .clock-container{margin-top:80px;text-align:center;color:white;text-shadow:0 2px 10px rgba(0,0,0,.2)}
        .lock-time{font-size:90px;font-weight:700;letter-spacing:-3px;line-height:1}
        .lock-date{font-size:20px;font-weight:500;text-transform:capitalize;margin-top:5px}
        .lock-shortcuts{margin-top:auto;margin-bottom:50px;width:100%;display:flex;justify-content:space-between;padding:0 40px}
        .glass-btn{width:50px;height:50px;border-radius:50%;background:rgba(0,0,0,.4);backdrop-filter:blur(20px);display:flex;justify-content:center;align-items:center;color:white;cursor:pointer}

        /* HOME */
        .home-screen{position:relative;z-index:1;padding:55px 20px 20px;height:100%;display:flex;flex-direction:column;gap:15px}
        .app-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 8px;overflow-y:auto;scrollbar-width:none}
        .app-grid::-webkit-scrollbar{display:none}
        .app-item{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
        .app-icon{width:62px;height:62px;border-radius:14px;display:flex;justify-content:center;align-items:center;background:var(--glass-bg);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.2);box-shadow:0 4px 10px rgba(0,0,0,.2);color:white;font-size:28px;position:relative;overflow:hidden;transition:filter .3s,transform .2s}
        .app-icon.flash-chaos{animation:iconFlash .5s ease forwards}
        @keyframes iconFlash{0%{filter:brightness(1)}25%{filter:brightness(2.5) hue-rotate(90deg)}75%{filter:brightness(1.5) hue-rotate(200deg)}100%{filter:brightness(1)}}
        .icon-cal{background:#fff;color:#ff3b30;flex-direction:column;font-size:10px;font-weight:800;gap:2px}
        .icon-cal span{font-size:28px;color:#000}
        .icon-maps{background:#4cd964}.icon-clock{background:#000;color:#fff;border:1px solid #333}
        .icon-weather{background:#5ac8fa}.icon-phone{background:#34c759}.icon-messages{background:#34c759}.icon-wallet{background:#000;border:1px solid #333}
        .app-name{font-size:11px;color:white;text-shadow:0 1px 2px rgba(0,0,0,.8)}
        .dock-bar{margin-top:auto;width:100%;height:95px;border-radius:35px;background:rgba(255,255,255,.2);backdrop-filter:blur(30px);display:flex;justify-content:space-evenly;align-items:center;border:1px solid rgba(255,255,255,.2);transition:background .4s}

        /* CAM */
        .cam-modes{display:flex;justify-content:center;gap:20px;padding:15px;background:rgba(0,0,0,.5);font-size:13px;color:#aaa}
        .cam-modes span.active{color:#fff;font-weight:600}
        .cam-filter-btn{width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;cursor:pointer;color:white}

        /* APP WINDOWS */
        .app-window{position:absolute;top:0;left:0;width:100%;height:100%;background:var(--app-bg);color:var(--app-text);z-index:1100;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .4s cubic-bezier(.32,.72,0,1);border-radius:55px;overflow:hidden}
        .app-window.open{transform:translateY(0)}
        .nav-bar{height:90px;padding:45px 20px 10px;display:flex;align-items:center;justify-content:space-between;background:rgba(245,245,245,.9);backdrop-filter:blur(10px);border-bottom:1px solid rgba(0,0,0,.1);font-weight:600;z-index:20}
        .iphone-frame.dark-mode .nav-bar{background:#1c1c1e;border-bottom:1px solid #333;color:white}
        .app-body{flex:1;overflow-y:auto}
        .camera-app{background:black!important;color:white;display:flex;flex-direction:column}
        .cam-controls{padding:20px;background:black;display:flex;justify-content:space-around;align-items:center;height:150px}
        .shutter{width:70px;height:70px;border-radius:50%;border:4px solid white;position:relative}
        .shutter::after{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:56px;height:56px;background:white;border-radius:50%;transition:.1s}
        .shutter:active::after{transform:translate(-50%,-50%) scale(.9)}
        .list-group{background:var(--list-bg);margin:20px;border-radius:12px;overflow:hidden}
        .list-item{padding:15px;border-bottom:1px solid var(--border-color);display:flex;justify-content:space-between;align-items:center;cursor:pointer}
        .list-item:last-child{border-bottom:none}
        .toggle{width:50px;height:30px;background:#e9e9ea;border-radius:15px;position:relative;transition:.3s}
        .toggle.active{background:#34c759}
        .toggle-handle{width:26px;height:26px;background:white;border-radius:50%;position:absolute;top:2px;left:2px;transition:.3s;box-shadow:0 2px 4px rgba(0,0,0,.2)}
        .toggle.active .toggle-handle{transform:translateX(20px)}
        .credit-card{background:linear-gradient(135deg,#1a1a1a,#444);border-radius:15px;height:200px;color:white;padding:25px;position:relative;box-shadow:0 10px 30px rgba(0,0,0,.3);margin:20px}
        .card-chip{width:50px;height:40px;background:linear-gradient(135deg,#FFD700,#FFA500);border-radius:8px}
        .card-cvc-timer{display:flex;flex-direction:column;gap:4px;align-items:flex-end}
        .cvc-bar{width:60px;height:4px;background:rgba(255,255,255,.2);border-radius:2px;overflow:hidden;margin-top:4px}
        .cvc-progress{width:100%;height:100%;background:#34c759;transition:width 1s linear}
        .card-number{font-size:22px;font-weight:600;letter-spacing:3px;margin:30px 0 20px}
        .card-container{padding-top:20px}
        .balance-section{padding:30px;text-align:center}
        .home-indicator{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:130px;height:5px;background:white;border-radius:10px;z-index:2000;cursor:pointer;transition:background-color .6s}
        .home-indicator.dark{background-color:#000}
        .status-bar{position:absolute;top:15px;width:100%;padding:0 25px;display:flex;justify-content:space-between;color:white;font-size:14px;font-weight:600;z-index:2000;transition:color .6s}
        .status-bar.dark{color:#000}
        .keypad,.calc-grid{display:grid;gap:12px;padding:20px;justify-items:center}
        .key-btn,.calc-btn{width:70px;height:70px;border-radius:50%;display:flex;justify-content:center;align-items:center;font-size:24px;cursor:pointer}
        .key-btn{background:#e5e5ea}.calc-btn{background:#333;color:white}
        .settings-page{width:100%;height:100%;position:absolute;top:0;left:0;background:var(--app-bg);transition:transform .3s ease;padding-top:90px}
        .settings-page.hidden{transform:translateX(100%)}
        .settings-page.main{z-index:1;padding-top:0}
        .settings-page.sub{z-index:2}

        /* MUSIC APP */
        #app-music{background:#000!important}
        #app-music .nav-bar{background:rgba(0,0,0,.9);color:white;border-bottom:1px solid #222}
        .music-app-inner{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;background:#000;padding:20px;gap:18px}
        .music-app-cover{width:200px;height:200px;border-radius:18px;object-fit:cover;box-shadow:0 20px 60px rgba(29,185,84,.4),0 0 0 1px rgba(255,255,255,.05);animation:coverFloat 3s ease-in-out infinite alternate}
        @keyframes coverFloat{from{transform:translateY(0) rotate(-1deg)}to{transform:translateY(-8px) rotate(1deg)}}
        .music-app-title{font-size:21px;font-weight:800;color:#fff;text-align:center;letter-spacing:-.5px}
        .music-app-artist{font-size:15px;color:rgba(255,255,255,.5);margin-top:-10px}
        .music-app-viz{display:flex;align-items:flex-end;gap:4px;height:40px}
        .music-app-bar{width:5px;border-radius:3px;background:linear-gradient(to top,#1db954,#57e389);animation:barDance .6s ease-in-out infinite alternate}
        .music-app-bar:nth-child(1){animation-duration:.5s;animation-delay:.00s}.music-app-bar:nth-child(2){animation-duration:.7s;animation-delay:.08s}.music-app-bar:nth-child(3){animation-duration:.45s;animation-delay:.18s}.music-app-bar:nth-child(4){animation-duration:.83s;animation-delay:.03s}.music-app-bar:nth-child(5){animation-duration:.57s;animation-delay:.13s}.music-app-bar:nth-child(6){animation-duration:.66s;animation-delay:.06s}.music-app-bar:nth-child(7){animation-duration:.41s;animation-delay:.22s}.music-app-bar:nth-child(8){animation-duration:.75s;animation-delay:.10s}.music-app-bar:nth-child(9){animation-duration:.52s;animation-delay:.16s}.music-app-bar:nth-child(10){animation-duration:.63s;animation-delay:.07s}
        @keyframes barDance{from{height:4px;opacity:.6}to{height:34px;opacity:1}}
        .music-app-progress-wrap{width:100%;height:4px;background:rgba(255,255,255,.1);border-radius:4px;overflow:hidden;cursor:pointer}
        .music-app-progress-bar{height:100%;background:linear-gradient(90deg,#1db954,#57e389);border-radius:4px;width:0%;transition:width .5s linear}
        .music-app-times{display:flex;justify-content:space-between;width:100%;font-size:11px;color:rgba(255,255,255,.4)}
        .music-app-controls{display:flex;align-items:center;gap:20px}
        .mac-btn{width:50px;height:50px;border:none;border-radius:50%;background:rgba(255,255,255,.08);color:white;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
        .mac-btn:active{transform:scale(.88)}
        .mac-btn.big{width:62px;height:62px;background:#fff;color:#000;font-size:24px;box-shadow:0 4px 20px rgba(255,255,255,.2)}

        /* EASTER EGG */
        #easterEgg{position:absolute;inset:0;z-index:9000;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.93);flex-direction:column;gap:16px;text-align:center}
        #easterEgg.show{display:flex;animation:fadeIn .4s}
        .egg-emoji{font-size:70px;animation:eggspin 1s linear infinite}
        @keyframes eggspin{from{transform:rotate(0deg) scale(1)}50%{transform:rotate(180deg) scale(1.2)}to{transform:rotate(360deg) scale(1)}}
        .egg-text{font-size:20px;font-weight:800;color:white;line-height:1.4}
        .egg-sub{font-size:13px;color:rgba(255,255,255,.5)}
        .egg-close{margin-top:10px;padding:10px 28px;border:none;border-radius:20px;background:#007aff;color:white;font-size:15px;font-weight:700;cursor:pointer}

        /* ADMIN ABUSE — FIJO ABAJO */
        #adminAbuse{position:absolute;bottom:0;left:0;right:0;z-index:8000;overflow:hidden;background:#000;border-top:1px solid rgba(255,255,255,.06)}
        #adminAbuse .aa-bg{position:absolute;inset:0;background-image:url('https://res.cloudinary.com/dhx58lnzb/image/upload/v1771370278/ab67616d0000b27349055dce3554e72e82082980_n3qzb1.jpg');background-size:cover;background-position:center;filter:blur(60px) brightness(.15) saturate(2);transform:scale(1.5);z-index:0}
        .aa-light{position:absolute;width:90px;height:90px;border-radius:50%;opacity:0;z-index:0;pointer-events:none;animation:lightPop 3s ease-in-out infinite}
        .aa-light:nth-child(2){background:radial-gradient(circle,#ff3b30,transparent);left:2%;top:-20px;animation-delay:0s}
        .aa-light:nth-child(3){background:radial-gradient(circle,#1db954,transparent);left:40%;top:-20px;animation-delay:.8s}
        .aa-light:nth-child(4){background:radial-gradient(circle,#007aff,transparent);right:2%;top:-20px;animation-delay:1.6s}
        .aa-light:nth-child(5){background:radial-gradient(circle,#FFD700,transparent);left:22%;top:-20px;animation-delay:2.4s}
        .aa-light:nth-child(6){background:radial-gradient(circle,#ff2d96,transparent);right:22%;top:-20px;animation-delay:3.2s}
        @keyframes lightPop{0%,100%{opacity:0}20%{opacity:.8}50%{opacity:.3}70%{opacity:.9}85%{opacity:0}}
        .aa-particle{position:absolute;border-radius:50%;pointer-events:none;z-index:0;animation:aaPartFloat linear infinite}
        @keyframes aaPartFloat{0%{transform:translateY(0) scale(0);opacity:0}10%{opacity:1}90%{opacity:.6}100%{transform:translateY(-120px) scale(1.5);opacity:0}}
        .aa-inner{position:relative;z-index:1;padding:10px 14px 12px;display:flex;flex-direction:column;gap:8px}
        .aa-live{display:flex;align-items:center;gap:5px;position:absolute;top:10px;right:14px;z-index:2}
        .aa-live-dot{width:8px;height:8px;border-radius:50%;background:#ff3b30;position:relative;flex-shrink:0}
        .aa-live-dot::before,.aa-live-dot::after{content:'';position:absolute;inset:-3px;border-radius:50%;border:1.5px solid #ff3b30;animation:liveRipple 1.6s ease-out infinite}
        .aa-live-dot::after{animation-delay:.8s}
        @keyframes liveRipple{0%{transform:scale(.6);opacity:1}100%{transform:scale(2.4);opacity:0}}
        .aa-live-dot-inner{position:absolute;inset:1px;border-radius:50%;background:#ff6b6b;animation:liveBlink 1s ease-in-out infinite alternate}
        @keyframes liveBlink{from{opacity:1;box-shadow:0 0 4px #ff3b30}to{opacity:.5;box-shadow:0 0 12px #ff0000}}
        .aa-live-text{font-size:9px;font-weight:800;letter-spacing:1.5px;color:#ff3b30;text-transform:uppercase;text-shadow:0 0 8px rgba(255,59,48,.6)}
        .aa-top{display:flex;align-items:center;gap:11px}

(function(){
  const cv=document.getElementById('bgCanvas'),ctx=cv.getContext('2d');
  let W,H,pts=[],flashes=[];
  const C=['#ff3b30','#1db954','#007aff','#FFD700','#ff2d96','#57e389','#00c7f7','#ff6b00','#a855f7'];
  function resize(){W=cv.width=window.innerWidth;H=cv.height=window.innerHeight;}
  resize(); window.addEventListener('resize',resize);
  for(let i=0;i<130;i++) pts.push({x:Math.random()*2000,y:Math.random()*1000,vx:(Math.random()-.5)*.7,vy:(Math.random()-.5)*.7,r:Math.random()*2.5+.5,color:C[Math.floor(Math.random()*C.length)],alpha:Math.random()*.7+.1,tw:Math.random()*Math.PI*2});
  setInterval(()=>{if(flashes.length<8) flashes.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*70+25,color:C[Math.floor(Math.random()*C.length)],life:1});},600);
  (function draw(){
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
    flashes.forEach((f,i)=>{
      f.life-=.035;if(f.life<=0){flashes.splice(i,1);return;}
      const g=ctx.createRadialGradient(f.x,f.y,0,f.x,f.y,f.r);
      g.addColorStop(0,f.color+Math.floor(f.life*160).toString(16).padStart(2,'0'));
      g.addColorStop(1,'transparent');
      ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();
    });
    pts.forEach(p=>{
      p.x+=p.vx;p.y+=p.vy;p.tw+=.05;
      if(p.x<0)p.x=W;if(p.x>W)p.x=0;if(p.y<0)p.y=H;if(p.y>H)p.y=0;
      const a=p.alpha*(.5+.5*Math.sin(p.tw));
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle=p.color;ctx.globalAlpha=a;ctx.fill();ctx.globalAlpha=1;
    });
    for(let i=0;i<pts.length;i++) for(let j=i+1;j<pts.length;j++){
      const dx=pts[i].x-pts[j].x,dy=pts[i].y-pts[j].y,d=Math.sqrt(dx*dx+dy*dy);
      if(d<85){ctx.beginPath();ctx.moveTo(pts[i].x,pts[i].y);ctx.lineTo(pts[j].x,pts[j].y);ctx.strokeStyle=pts[i].color;ctx.globalAlpha=(1-d/85)*.15;ctx.lineWidth=.5;ctx.stroke();ctx.globalAlpha=1;}
    }
    requestAnimationFrame(draw);
  })();
})();

// ══════════════════════════════════
//  ADMIN ABUSE MUSIC PLAYER
// ══════════════════════════════════
(function(){
  const audio=document.getElementById('aaAudio');
  const playBtn=document.getElementById('aaPlayPause');
  const mapBtn=document.getElementById('mapPlayPause');
  const progressBar=document.getElementById('aaProgress');
  const mapBar=document.getElementById('mapProgress');
  const progressWrap=document.getElementById('aaProgressWrap');
  const mapWrap=document.getElementById('mapProgressWrap');
  const currentEl=document.getElementById('aaCurrent');
  const mapCurEl=document.getElementById('mapCurrent');
  const durEl=document.getElementById('aaDuration');
  const mapDurEl=document.getElementById('mapDuration');
  const vizEl=document.getElementById('aaViz');
  const miViz=document.getElementById('miMiniViz');
  const musicViz=document.getElementById('musicAppViz');
  const notch=document.getElementById('notch');
  let playing=false,notchShown=false,notchTimer=null;

  function fmt(s){if(!s||isNaN(s))return'0:00';const m=Math.floor(s/60),sec=Math.floor(s%60);return m+':'+(sec<10?'0':'')+sec;}
  function setViz(on){
    [vizEl,miViz].forEach(v=>{if(!v)return;v.querySelectorAll('.aa-bar,.mi-bar').forEach(b=>b.style.animationPlayState=on?'running':'paused');});
    if(musicViz)musicViz.querySelectorAll('.music-app-bar').forEach(b=>b.style.animationPlayState=on?'running':'paused');
  }
  function showMusicIsland(){
    notch.classList.remove('expanded-charge','expanded-faceid','expanded-language','welcome-aura');
    notch.classList.add('expanded-music');
    notchShown=true;clearTimeout(notchTimer);
    notchTimer=setTimeout(hideMusicIsland,6000);
  }
  function hideMusicIsland(){notch.classList.remove('expanded-music');notchShown=false;}
  window.notchMusicToggle=function(){if(playing){notchShown?hideMusicIsland():showMusicIsland();}};

  audio.addEventListener('timeupdate',()=>{
    if(!audio.duration)return;
    const p=audio.currentTime/audio.duration*100;
    progressBar.style.width=p+'%';if(mapBar)mapBar.style.width=p+'%';
    currentEl.textContent=fmt(audio.currentTime);if(mapCurEl)mapCurEl.textContent=fmt(audio.currentTime);
  });
  audio.addEventListener('loadedmetadata',()=>{
    durEl.textContent=fmt(audio.duration);if(mapDurEl)mapDurEl.textContent=fmt(audio.duration);
  });
  audio.addEventListener('ended',()=>{audio.currentTime=0;audio.play();});

  function setPlaying(on){
    playing=on;
    const ic=on?'⏸':'▶';
    playBtn.textContent=ic;if(mapBtn)mapBtn.textContent=ic;
    setViz(on);
    if(on)showMusicIsland();else hideMusicIsland();
  }
  window.aaToggle=function(){
    if(playing){audio.pause();setPlaying(false);}
    else{audio.play().catch(()=>{});setPlaying(true);}
  };
  window.aaSkip=function(s){audio.currentTime=Math.max(0,Math.min(audio.duration||233,audio.currentTime+s));};

  function seek(e,wrap){if(!audio.duration)return;const r=wrap.getBoundingClientRect();audio.currentTime=((e.clientX-r.left)/r.width)*audio.duration;}
  progressWrap.addEventListener('click',e=>seek(e,progressWrap));
  if(mapWrap)mapWrap.addEventListener('click',e=>seek(e,mapWrap));

  function tryPlay(){
    audio.play().then(()=>setPlaying(true)).catch(()=>{
      const go=()=>{audio.play().then(()=>setPlaying(true)).catch(()=>{});document.removeEventListener('click',go);document.removeEventListener('touchend',go);};
      document.addEventListener('click',go);document.addEventListener('touchend',go);
    });
  }
  tryPlay();
})();
