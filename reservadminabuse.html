<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Abuse WTC Liquid</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #FFD700;
    --gold2: #FFA500;
    --neon: #00FFFF;
    --red: #FF2244;
    --bg: #020408;
    --panel: rgba(0,0,0,0.7);
    --border: rgba(0,255,255,0.15);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: #fff;
    font-family: 'Rajdhani', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Animated background */
  .bg-grid {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background-image:
      linear-gradient(rgba(0,255,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,255,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    z-index: 0;
    animation: gridMove 20s linear infinite;
  }

  @keyframes gridMove {
    0% { transform: translateY(0); }
    100% { transform: translateY(40px); }
  }

  .particles {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
  }

  .particle {
    position: absolute;
    width: 2px;
    height: 2px;
    background: var(--gold);
    border-radius: 50%;
    animation: float linear infinite;
    opacity: 0;
  }

  @keyframes float {
    0% { transform: translateY(100vh) translateX(0); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 0.8; }
    100% { transform: translateY(-10vh) translateX(calc(var(--dx) * 100px)); opacity: 0; }
  }

  .wrapper {
    position: relative;
    z-index: 1;
    max-width: 1100px;
    margin: 0 auto;
    padding: 20px 16px 40px;
  }

  /* HEADER */
  header {
    text-align: center;
    padding: 30px 0 10px;
    position: relative;
  }

  .header-glow {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 500px; height: 200px;
    background: radial-gradient(ellipse, rgba(255,215,0,0.12) 0%, transparent 70%);
    pointer-events: none;
  }

  .title-main {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(22px, 5vw, 46px);
    font-weight: 900;
    letter-spacing: 6px;
    background: linear-gradient(135deg, #FFD700, #FF6B00, #FFD700);
    background-size: 200% 200%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: shimmer 3s ease-in-out infinite;
    text-shadow: none;
    filter: drop-shadow(0 0 20px rgba(255,215,0,0.5));
  }

  @keyframes shimmer {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }

  .title-sub {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(10px, 2vw, 14px);
    letter-spacing: 12px;
    color: var(--neon);
    margin-top: 6px;
    text-transform: uppercase;
    opacity: 0.8;
  }

  .divider {
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), var(--neon), var(--gold), transparent);
    margin: 20px 0;
    animation: divPulse 2s ease-in-out infinite;
  }

  @keyframes divPulse {
    0%, 100% { opacity: 0.6; }
    50% { opacity: 1; }
  }

  /* COUNTER */
  .counter-section {
    text-align: center;
    padding: 30px 20px;
    background: rgba(0,0,0,0.5);
    border: 1px solid rgba(255,215,0,0.2);
    border-radius: 16px;
    margin-bottom: 24px;
    position: relative;
    overflow: hidden;
    backdrop-filter: blur(10px);
  }

  .counter-section::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(255,215,0,0.04), rgba(0,255,255,0.02));
    pointer-events: none;
  }

  .counter-label {
    font-family: 'Orbitron', sans-serif;
    font-size: 11px;
    letter-spacing: 8px;
    color: var(--neon);
    text-transform: uppercase;
    margin-bottom: 8px;
    opacity: 0.7;
  }

  .counter-number {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(52px, 12vw, 110px);
    font-weight: 900;
    line-height: 1;
    position: relative;
    display: inline-block;
  }

  .counter-number .digits {
    background: linear-gradient(180deg, #FFFFFF 0%, #FFD700 40%, #FF8C00 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 0 30px rgba(255,200,0,0.6));
  }

  .counter-number.bump .digits {
    animation: bumpAnim 0.3s ease-out;
  }

  @keyframes bumpAnim {
    0% { transform: scale(1); filter: drop-shadow(0 0 30px rgba(255,200,0,0.6)); }
    50% { transform: scale(1.08); filter: drop-shadow(0 0 60px rgba(255,150,0,1)) drop-shadow(0 0 100px rgba(255,50,0,0.5)); }
    100% { transform: scale(1); filter: drop-shadow(0 0 30px rgba(255,200,0,0.6)); }
  }

  .counter-number.mega-bump .digits {
    animation: megaBump 0.6s ease-out;
  }

  @keyframes megaBump {
    0% { transform: scale(1); }
    30% { transform: scale(1.25) translateY(-10px); filter: drop-shadow(0 0 80px rgba(255,0,0,1)); }
    60% { transform: scale(1.1); }
    100% { transform: scale(1); }
  }

  .counter-sub {
    font-family: 'Rajdhani', sans-serif;
    font-size: 16px;
    color: rgba(255,255,255,0.5);
    letter-spacing: 3px;
    margin-top: 8px;
  }

  .counter-pulse-ring {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 300px; height: 300px;
    border-radius: 50%;
    border: 1px solid rgba(255,215,0,0.3);
    animation: ringPulse 2s ease-out infinite;
    pointer-events: none;
  }

  .counter-pulse-ring:nth-child(2) { animation-delay: 0.6s; }
  .counter-pulse-ring:nth-child(3) { animation-delay: 1.2s; }

  @keyframes ringPulse {
    0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.8; }
    100% { transform: translate(-50%, -50%) scale(1.5); opacity: 0; }
  }

  /* FLASH OVERLAY */
  .flash-overlay {
    position: fixed;
    inset: 0;
    background: rgba(255,50,50,0.15);
    z-index: 999;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.1s;
  }

  .flash-overlay.active {
    animation: flashAnim 0.6s ease-out forwards;
  }

  @keyframes flashAnim {
    0% { opacity: 1; }
    100% { opacity: 0; }
  }

  /* BUTTONS */
  .btn-row {
    display: flex;
    gap: 16px;
    justify-content: center;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }

  .btn-vip, .btn-guest {
    font-family: 'Orbitron', sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 2px;
    padding: 14px 28px;
    border: none;
    cursor: pointer;
    border-radius: 8px;
    position: relative;
    overflow: hidden;
    text-transform: uppercase;
    transition: transform 0.2s, box-shadow 0.2s;
  }

  .btn-vip {
    background: linear-gradient(135deg, #8B6914, #FFD700, #8B6914);
    color: #000;
    box-shadow: 0 0 20px rgba(255,215,0,0.4), 0 0 40px rgba(255,215,0,0.2);
  }

  .btn-vip:hover {
    transform: scale(1.05) translateY(-2px);
    box-shadow: 0 0 40px rgba(255,215,0,0.8), 0 10px 30px rgba(0,0,0,0.5);
  }

  .btn-guest {
    background: linear-gradient(135deg, #1a3a4a, #00FFFF22, #1a3a4a);
    color: var(--neon);
    box-shadow: 0 0 20px rgba(0,255,255,0.2);
    border: 1px solid rgba(0,255,255,0.4);
  }

  .btn-guest:hover {
    transform: scale(1.05) translateY(-2px);
    box-shadow: 0 0 40px rgba(0,255,255,0.4), 0 10px 20px rgba(0,0,0,0.5);
  }

  .btn-vip::before, .btn-guest::before {
    content: '';
    position: absolute;
    top: -50%; left: -50%;
    width: 200%; height: 200%;
    background: linear-gradient(45deg, transparent, rgba(255,255,255,0.1), transparent);
    transform: translateX(-100%);
    transition: transform 0.4s;
  }

  .btn-vip:hover::before, .btn-guest:hover::before {
    transform: translateX(100%);
  }

  .btn-badge {
    display: inline-block;
    background: rgba(0,0,0,0.3);
    border-radius: 50%;
    width: 22px; height: 22px;
    line-height: 22px;
    text-align: center;
    font-size: 11px;
    margin-left: 6px;
  }

  /* SPOTS */
  .spots-display {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }

  .spot-card {
    background: rgba(0,0,0,0.6);
    border-radius: 10px;
    padding: 12px 24px;
    text-align: center;
    border: 1px solid rgba(255,255,255,0.08);
    min-width: 150px;
  }

  .spot-card.vip-card { border-color: rgba(255,215,0,0.4); }
  .spot-card.guest-card { border-color: rgba(0,255,255,0.2); }

  .spot-num {
    font-family: 'Orbitron', sans-serif;
    font-size: 32px;
    font-weight: 900;
  }

  .spot-card.vip-card .spot-num {
    color: var(--gold);
    text-shadow: 0 0 20px rgba(255,215,0,0.5);
  }

  .spot-card.guest-card .spot-num { color: var(--neon); }

  .spot-lbl {
    font-size: 11px;
    letter-spacing: 3px;
    color: rgba(255,255,255,0.5);
    text-transform: uppercase;
    margin-top: 2px;
  }

  /* CHAT */
  .chat-section {
    background: rgba(0,0,0,0.65);
    border: 1px solid rgba(0,255,255,0.12);
    border-radius: 14px;
    overflow: hidden;
    backdrop-filter: blur(8px);
  }

  .chat-header {
    background: linear-gradient(90deg, rgba(0,255,255,0.08), rgba(255,215,0,0.05));
    padding: 12px 20px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid rgba(0,255,255,0.1);
  }

  .chat-dot {
    width: 8px; height: 8px;
    background: #00FF88;
    border-radius: 50%;
    box-shadow: 0 0 8px #00FF88;
    animation: dotBlink 1.5s ease-in-out infinite;
  }

  @keyframes dotBlink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .chat-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 12px;
    letter-spacing: 4px;
    color: var(--neon);
  }

  .chat-count {
    margin-left: auto;
    font-size: 12px;
    color: rgba(255,255,255,0.4);
    letter-spacing: 1px;
  }

  .chat-messages {
    height: 300px;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    scroll-behavior: smooth;
  }

  .chat-messages::-webkit-scrollbar { width: 4px; }
  .chat-messages::-webkit-scrollbar-track { background: transparent; }
  .chat-messages::-webkit-scrollbar-thumb { background: rgba(255,215,0,0.3); border-radius: 2px; }

  .chat-msg {
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 14px;
    line-height: 1.4;
    animation: msgSlide 0.3s ease-out;
    background: rgba(255,255,255,0.03);
    border-left: 2px solid transparent;
  }

  @keyframes msgSlide {
    from { transform: translateX(-20px); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }

  .chat-msg.normal { border-color: rgba(0,255,255,0.2); }

  .chat-msg.vip {
    background: rgba(255,215,0,0.06);
    border-left: 3px solid var(--gold);
    animation: msgSlide 0.3s ease-out, vipGlow 0.8s ease-out;
  }

  @keyframes vipGlow {
    0% { box-shadow: 0 0 0 rgba(255,215,0,0); background: rgba(255,215,0,0.2); }
    50% { box-shadow: 0 0 30px rgba(255,215,0,0.3); }
    100% { box-shadow: 0 0 0 rgba(255,215,0,0); }
  }

  .msg-name { font-weight: 700; }
  .msg-name.normal-name { color: #aaddff; }
  .msg-name.vip-name {
    color: #FFD700;
    text-shadow: 0 0 8px rgba(255,215,0,0.6);
  }

  .msg-vip-badge {
    display: inline-block;
    background: linear-gradient(135deg, #8B6914, #FFD700);
    color: #000;
    font-size: 9px;
    font-weight: 900;
    padding: 1px 6px;
    border-radius: 3px;
    margin-left: 4px;
    font-family: 'Orbitron', sans-serif;
    letter-spacing: 1px;
  }

  .msg-text { color: rgba(255,255,255,0.7); margin-left: 4px; }

  /* NOTIFICATION TOAST */
  .toast-container {
    position: fixed;
    top: 20px; right: 20px;
    z-index: 100;
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-width: 320px;
  }

  .toast {
    background: rgba(0,0,0,0.9);
    border: 1px solid var(--gold);
    border-radius: 10px;
    padding: 12px 16px;
    font-family: 'Rajdhani', sans-serif;
    font-size: 14px;
    color: #fff;
    box-shadow: 0 0 30px rgba(255,215,0,0.3);
    animation: toastIn 0.4s ease-out, toastOut 0.4s ease-in 3s forwards;
    backdrop-filter: blur(12px);
  }

  @keyframes toastIn {
    from { transform: translateX(100px); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }

  @keyframes toastOut {
    from { transform: translateX(0); opacity: 1; }
    to { transform: translateX(100px); opacity: 0; }
  }

  .toast-icon { font-size: 18px; margin-right: 8px; }

  /* stats bar */
  .stats-bar {
    display: flex;
    justify-content: center;
    gap: 30px;
    margin: 16px 0;
    flex-wrap: wrap;
  }

  .stat-item {
    font-size: 12px;
    letter-spacing: 2px;
    color: rgba(255,255,255,0.4);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .stat-dot { width: 6px; height: 6px; border-radius: 50%; }
  .stat-dot.green { background: #00FF88; box-shadow: 0 0 6px #00FF88; }
  .stat-dot.gold { background: var(--gold); box-shadow: 0 0 6px var(--gold); }

  .rate-badge {
    display: inline-block;
    background: rgba(0,255,0,0.1);
    border: 1px solid rgba(0,255,0,0.3);
    color: #00FF88;
    font-family: 'Orbitron', sans-serif;
    font-size: 11px;
    padding: 4px 12px;
    border-radius: 20px;
    letter-spacing: 2px;
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 rgba(0,255,0,0); }
    50% { box-shadow: 0 0 15px rgba(0,255,0,0.3); }
  }
</style>
</head>
<body>

<div class="flash-overlay" id="flashOverlay"></div>

<div class="bg-grid"></div>
<div class="particles" id="particles"></div>

<div class="toast-container" id="toastContainer"></div>

<div class="wrapper">
  <header>
    <div class="header-glow"></div>
    <div class="title-main">ADMIN ABUSE</div>
    <div style="display:flex;gap:16px;justify-content:center;margin:8px 0">
      <span style="font-family:'Orbitron',sans-serif;font-size:clamp(14px,3vw,28px);font-weight:900;color:#00FFFF;letter-spacing:4px;filter:drop-shadow(0 0 12px #00FFFF)">WTC</span>
      <span style="font-family:'Orbitron',sans-serif;font-size:clamp(14px,3vw,28px);font-weight:900;background:linear-gradient(135deg,#00FFFF,#0080FF);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;filter:drop-shadow(0 0 15px rgba(0,200,255,0.6));letter-spacing:4px">LIQUID</span>
    </div>
    <div class="title-sub">SERVIDOR EXCLUSIVO · ACCESO LIMITADO</div>
  </header>

  <div class="divider"></div>

  <!-- COUNTER -->
  <div class="counter-section" id="counterSection">
    <div class="counter-pulse-ring"></div>
    <div class="counter-pulse-ring"></div>
    <div class="counter-pulse-ring"></div>
    <div class="counter-label">👥 Personas Esperando</div>
    <div class="counter-number" id="counterEl">
      <span class="digits" id="counterDigits">15,999</span>
    </div>
    <div class="counter-sub">en la fila de espera</div>
    <div class="stats-bar" style="margin-top:16px">
      <div class="stat-item"><div class="stat-dot green"></div> SERVIDOR EN VIVO</div>
      <div class="rate-badge">+5 / SEG</div>
      <div class="stat-item"><div class="stat-dot gold"></div> VIP ACTIVO</div>
    </div>
  </div>

  <!-- BUTTONS -->
  <div class="btn-row">
    <button class="btn-vip" onclick="reserveVIP()">
      👑 Reservar VIP <span class="btn-badge">5</span> Lugares
    </button>
    <button class="btn-guest" onclick="reserveGuest()">
      🎫 Reservar <span class="btn-badge">5</span> Invitados
    </button>
  </div>

  <!-- SPOTS -->
  <div class="spots-display">
    <div class="spot-card vip-card">
      <div class="spot-num" id="vipSpots">0</div>
      <div class="spot-lbl">💎 VIP Reservados</div>
    </div>
    <div class="spot-card guest-card">
      <div class="spot-num" id="guestSpots">0</div>
      <div class="spot-lbl">🎫 Invitados Reservados</div>
    </div>
  </div>

  <!-- CHAT -->
  <div class="chat-section">
    <div class="chat-header">
      <div class="chat-dot"></div>
      <span class="chat-title">CHAT EN VIVO</span>
      <span class="chat-count" id="chatCount">0 mensajes</span>
    </div>
    <div class="chat-messages" id="chatMessages"></div>
  </div>
</div>

<script>
  // ─── CONFIG ───────────────────────────────────────────────────────
  let count = 15999;
  let vipReserved = 0;
  let guestReserved = 0;
  let msgCount = 0;
  let isPageVisible = true;

  const vipMaterials = [
    'Diamante','Oro','Platino','Esmeralda','Rubí','Zafiro','Ámbar',
    'Ópalo','Topacio','Jade','Aguamarina','Obsidiana','Turquesa',
    'Amatista','Berilo','Corindón','Granate','Labradorita'
  ];

  const adjectives = ['Pro','Dark','Elite','Shadow','Neo','Ultra','Hyper','Omega','Alpha','Apex'];
  const nouns = ['Gamer','Player','Killer','Hunter','Master','Ninja','Ghost','Storm','Blade','Wolf'];

  let usedVipMaterials = [];

  // ─── PARTICLES ────────────────────────────────────────────────────
  const particlesEl = document.getElementById('particles');
  for (let i = 0; i < 40; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.cssText = `
      left: ${Math.random()*100}%;
      animation-duration: ${4 + Math.random()*8}s;
      animation-delay: ${Math.random()*8}s;
      --dx: ${(Math.random()-0.5)*2};
      width: ${1+Math.random()*3}px;
      height: ${1+Math.random()*3}px;
      background: ${Math.random() > 0.5 ? '#FFD700' : '#00FFFF'};
    `;
    particlesEl.appendChild(p);
  }

  // ─── COUNTER ──────────────────────────────────────────────────────
  function formatNum(n) {
    return n.toLocaleString('es-MX');
  }

  function updateCounter(amount, isMega = false) {
    count += amount;
    const el = document.getElementById('counterEl');
    const digits = document.getElementById('counterDigits');
    digits.textContent = formatNum(count);
    el.classList.remove('bump', 'mega-bump');
    void el.offsetWidth;
    el.classList.add(isMega ? 'mega-bump' : 'bump');
    if (isMega) {
      const flash = document.getElementById('flashOverlay');
      flash.classList.remove('active');
      void flash.offsetWidth;
      flash.classList.add('active');
    }
  }

  // +5 every second
  setInterval(() => updateCounter(5), 1000);

  // Page visibility — add 1000 on return
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && !isPageVisible) {
      updateCounter(1000, true);
      showToast('🔥 +1,000 personas se unieron mientras estabas fuera!', 'vip');
    }
    isPageVisible = !document.hidden;
  });

  window.addEventListener('blur', () => { isPageVisible = false; });
  window.addEventListener('focus', () => {
    if (!isPageVisible) {
      updateCounter(1000, true);
      showToast('🔥 +1,000 personas se unieron mientras estabas fuera!', 'vip');
    }
    isPageVisible = true;
  });

  // ─── CHAT ─────────────────────────────────────────────────────────
  function randName() {
    const prefix = ['invitado','guest','user','player','xX'];
    const p = prefix[Math.floor(Math.random()*prefix.length)];
    const num = String(Math.floor(Math.random()*9000)+1000);
    return p + num;
  }

  function addChatMsg(name, text, isVip = false, material = '') {
    msgCount++;
    const chat = document.getElementById('chatMessages');
    const div = document.createElement('div');
    div.className = 'chat-msg ' + (isVip ? 'vip' : 'normal');

    if (isVip) {
      div.innerHTML = `
        <span class="msg-name vip-name">⭐ ${name}</span>
        <span class="msg-vip-badge">VIP ${material.toUpperCase()}</span>
        <span class="msg-text">se unió al servidor</span>
      `;
    } else {
      div.innerHTML = `
        <span class="msg-name normal-name">${name}</span>
        <span class="msg-text">${text}</span>
      `;
    }

    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    document.getElementById('chatCount').textContent = msgCount + ' mensajes';

    // Keep max 80 msgs
    while (chat.children.length > 80) chat.removeChild(chat.firstChild);
  }

  const joinPhrases = [
    'se unió a la sala',
    'entró al servidor',
    'está en la fila',
    'acaba de unirse',
    'se conectó',
    'entró a WTC Liquid',
  ];

  // Random join every 1.5-3s
  function scheduleRandomJoin() {
    const delay = 1500 + Math.random() * 1500;
    setTimeout(() => {
      const name = randName();
      const phrase = joinPhrases[Math.floor(Math.random()*joinPhrases.length)];
      addChatMsg(name, phrase, false);
      scheduleRandomJoin();
    }, delay);
  }
  scheduleRandomJoin();

  // VIP join every 5s
  function getNextVipMaterial() {
    if (usedVipMaterials.length >= vipMaterials.length) usedVipMaterials = [];
    const available = vipMaterials.filter(m => !usedVipMaterials.includes(m));
    const mat = available[Math.floor(Math.random()*available.length)];
    usedVipMaterials.push(mat);
    return mat;
  }

  setInterval(() => {
    const mat = getNextVipMaterial();
    const name = 'VIP_' + adjectives[Math.floor(Math.random()*adjectives.length)];
    addChatMsg(name, '', true, mat);
    updateCounter(1);
  }, 5000);

  // ─── TOAST ────────────────────────────────────────────────────────
  function showToast(msg, type = 'normal') {
    const container = document.getElementById('toastContainer');
    const toast = document.createElement('div');
    toast.className = 'toast';
    toast.style.borderColor = type === 'vip' ? '#FFD700' : '#00FFFF';
    toast.style.boxShadow = type === 'vip'
      ? '0 0 30px rgba(255,215,0,0.4)'
      : '0 0 20px rgba(0,255,255,0.3)';
    toast.innerHTML = msg;
    container.appendChild(toast);
    setTimeout(() => toast.remove(), 3600);
  }

  // ─── RESERVE BUTTONS ──────────────────────────────────────────────
  function reserveVIP() {
    vipReserved += 5;
    updateCounter(5, true);
    document.getElementById('vipSpots').textContent = vipReserved;

    const mat = getNextVipMaterial();
    const name = 'VIP_' + adjectives[Math.floor(Math.random()*adjectives.length)];
    addChatMsg(name, '', true, mat);
    addChatMsg(name, '', true, getNextVipMaterial());
    addChatMsg('VIP_' + nouns[Math.floor(Math.random()*nouns.length)], '', true, getNextVipMaterial());

    showToast(`👑 ¡5 lugares VIP reservados! <br><small style="color:${vipMaterials[0]=='Diamante'?'#B9F2FF':'#FFD700'}">Material exclusivo asignado: ${mat}</small>`, 'vip');
  }

  function reserveGuest() {
    guestReserved += 5;
    updateCounter(5);
    document.getElementById('guestSpots').textContent = guestReserved;

    for (let i = 0; i < 5; i++) {
      setTimeout(() => {
        const name = randName();
        addChatMsg(name, 'reservó su lugar como invitado 🎫');
      }, i * 200);
    }
    showToast('🎫 ¡5 invitados reservados exitosamente!', 'normal');
  }

  // ─── INITIAL MESSAGES ─────────────────────────────────────────────
  const initMsgs = [
    ['invitado7832', 'se unió a la sala'],
    ['invitado2291', 'está en la fila'],
    ['invitado5507', 'acaba de unirse'],
  ];
  initMsgs.forEach((m, i) => {
    setTimeout(() => addChatMsg(m[0], m[1]), i * 300);
  });
</script>
</body>
</html>
