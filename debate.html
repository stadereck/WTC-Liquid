<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jeffrey Epstein X WTC</title>

<link rel="icon" href="https://res.cloudinary.com/dhx58lnzb/image/upload/v1772305788/Jeffrey-removebg-preview_u9pyp0.png">

<style>

body,html{
margin:0;
padding:0;
height:100%;
overflow:hidden;
background:#030303;
font-family:Segoe UI,Tahoma,Geneva,Verdana,sans-serif;
cursor:crosshair;
}

#canvas-container{
position:absolute;
top:50%;
left:50%;
width:0;
height:0;
transform:translateZ(0);
}

.cuadrado-droste{

position:absolute;

border:3px solid white;

width:240vmax;
height:240vmax;

border-radius:2%;

mix-blend-mode:screen;

will-change:transform;

backface-visibility:hidden;

box-shadow:0 0 1vmin white;

}

#ui-instrucciones{

position:absolute;
bottom:25px;
left:50%;
transform:translateX(-50%);
color:rgba(255,255,255,.7);
background:rgba(0,0,0,.4);
padding:8px 18px;
border-radius:20px;
font-size:13px;
letter-spacing:2px;
pointer-events:none;
}

</style>
</head>

<body>

<div id="ui-instrucciones">
Proximo Debate en ∞
</div>

<div id="canvas-container"></div>

<script>

const contenedor=document.getElementById("canvas-container");

/* DETECCION HARDWARE */

const esMovil=/Mobi|Android|iPhone/i.test(navigator.userAgent);

const potencia=
navigator.hardwareConcurrency||4;


/* CALIDAD AUTOMATICA */

let numCuadrados=40;

if(potencia>=8) numCuadrados=55;
if(esMovil) numCuadrados=35;


/* PARAMETROS */

const escalaFactor=0.82;
const rotPaso=6;

const zoomVel=0.0006;

const cuadrados=[];


/* CREACION */

for(let i=0;i<numCuadrados;i++){

const d=document.createElement("div");

d.className="cuadrado-droste";

contenedor.appendChild(d);

cuadrados.push(d);

}


/* RATON */

let tx=0;
let ty=0;

let mx=0;
let my=0;


document.addEventListener("mousemove",e=>{

tx=(e.clientX/window.innerWidth)*2-1;
ty=(e.clientY/window.innerHeight)*2-1;

},{passive:true});


document.addEventListener("touchmove",e=>{

if(e.touches[0]){

tx=(e.touches[0].clientX/window.innerWidth)*2-1;
ty=(e.touches[0].clientY/window.innerHeight)*2-1;

}

},{passive:true});


/* ESCALA */

let escalaPantalla=1;

function ajustarEscala(){

let base=Math.min(innerWidth,innerHeight);

escalaPantalla=base/900;

if(!esMovil) escalaPantalla*=0.9;

}

ajustarEscala();

addEventListener("resize",ajustarEscala);


/* LOOP ULTRA */

let inicio=performance.now();

let frame=0;


function animar(t){

const dt=t-inicio;

mx+=(tx-mx)*0.05;
my+=(ty-my)*0.05;

const zoom=(dt*zoomVel)%1;

const rotGlobal=dt*0.01;


/* COLORES SOLO CADA 3 FRAMES */

const actualizarColor=(frame%3==0);


for(let i=0;i<numCuadrados;i++){

const el=cuadrados[i];

const idx=i-zoom;

const scale=Math.pow(escalaFactor,idx)*escalaPantalla;

const rot=idx*rotPaso+rotGlobal;

const dx=mx*idx*1.2;
const dy=my*idx*1.2;


/* TRANSFORM GPU */

el.style.transform=
`translate3d(-50%,-50%,0)
translate3d(${dx}vmin,${dy}vmin,0)
rotate(${rot}deg)
scale(${scale})`;


/* COLOR RARO SOLO CADA FRAMES */

if(actualizarColor){

const hue=(idx*14+dt*0.03)%360;

el.style.borderColor=
`hsl(${hue},100%,60%)`;

}


/* OPACIDAD */

let op=1;

if(idx>numCuadrados-3)
op=(numCuadrados-idx)/3;

el.style.opacity=op;

}


frame++;

requestAnimationFrame(animar);

}


requestAnimationFrame(animar);

</script>

</body>
</html>
