<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jeffrey Epstein X WTC</title>
<link rel="icon" href="https://res.cloudinary.com/dhx58lnzb/image/upload/v1772305788/Jeffrey-removebg-preview_u9pyp0.png">

<style>
body,html{
margin:0;
padding:0;
width:100%;
height:100%;
overflow:hidden;
background:#030303;
font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
cursor:crosshair;
}

#canvas-container{
position:absolute;
top:50%;
left:50%;
width:0;
height:0;
transform:translateZ(0);
}

.cuadrado-droste{
position:absolute;
box-sizing:border-box;
border:3px solid white;
width:250vmax;
height:250vmax;
border-radius:2%;
mix-blend-mode:screen;
will-change:transform,opacity;
backface-visibility:hidden;
box-shadow:0 0 2vmin rgba(255,255,255,.6),inset 0 0 2vmin rgba(255,255,255,.6);
}

#ui-instrucciones{
position:absolute;
bottom:30px;
left:50%;
transform:translateX(-50%);
color:rgba(255,255,255,.7);
background:rgba(0,0,0,.5);
padding:10px 20px;
border-radius:20px;
font-size:14px;
letter-spacing:2px;
text-transform:uppercase;
pointer-events:none;
transition:opacity .5s;
backdrop-filter:blur(4px);
border:1px solid rgba(255,255,255,.2);
}
</style>
</head>

<body>

<div id="ui-instrucciones">Proximo Debate en ∞</div>
<div id="canvas-container"></div>

<script>

const contenedor=document.getElementById('canvas-container');
const instrucciones=document.getElementById('ui-instrucciones');

const numCuadrados=65;
const factorEscala=0.82;
const pasoRotacion=6;
const pasoTono=15;
const velocidadZoom=0.0006;
const velocidadColor=0.05;

const cuadrados=new Array(numCuadrados);

let objetivoX=0;
let objetivoY=0;
let ratonX=0;
let ratonY=0;

for(let i=0;i<numCuadrados;i++){
const div=document.createElement('div');
div.className='cuadrado-droste';
contenedor.appendChild(div);
cuadrados[i]=div;
}

function actualizarRaton(x,y){
objetivoX=x*2-1;
objetivoY=y*2-1;
instrucciones.style.opacity='0.3';
}

document.addEventListener('mousemove',e=>{
actualizarRaton(e.clientX/window.innerWidth,e.clientY/window.innerHeight);
},{passive:true});

document.addEventListener('touchmove',e=>{
if(e.touches.length>0){
const t=e.touches[0];
actualizarRaton(t.clientX/window.innerWidth,t.clientY/window.innerHeight);
}
},{passive:true});

let inicio=performance.now();

function animar(t){

const dt=t-inicio;

ratonX+=(objetivoX-ratonX)*0.05;
ratonY+=(objetivoY-ratonY)*0.05;

const zoom=(dt*velocidadZoom)%1;
const rotGlobal=dt*0.01;
const colorTiempo=dt*velocidadColor;

for(let i=0;i<numCuadrados;i++){

const el=cuadrados[i];
const idx=i-zoom;

const escala=Math.pow(factorEscala,idx);
const rot=idx*pasoRotacion+rotGlobal;

const dx=ratonX*idx*1.5;
const dy=ratonY*idx*1.5;

const tono=(idx*pasoTono+colorTiempo)%360;
const color=`hsl(${tono},100%,60%)`;

el.style.transform=`translate3d(${dx-50}vmin,${dy-50}vmin,0) rotate(${rot}deg) scale(${escala})`;
el.style.borderColor=color;
el.style.boxShadow=`0 0 2vmin ${color}, inset 0 0 2vmin ${color}`;

let op=1;
if(idx>numCuadrados-3) op=(numCuadrados-idx)/3;
el.style.opacity=Math.max(0,Math.min(1,op));
}

requestAnimationFrame(animar);
}

requestAnimationFrame(animar);

</script>

</body>
</html>
