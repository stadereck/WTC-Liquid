
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WTC X Assumptions</title>
<link rel="icon" href="https://www.svgrepo.com/show/503173/apple-logo.svg" type="image/svg+xml">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', sans-serif;
  background: #000;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* ── SVG filters (hidden) ─────────────────────────────────── */
.svg-filters { position: absolute; width: 0; height: 0; overflow: hidden; pointer-events: none; }

/* ── Background video ─────────────────────────────────────── */
#bgVideo {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: 0;
  filter: blur(45px) brightness(0.4) saturate(2);
  transform: scale(1.12);
}

.bg-overlay {
  position: fixed;
  inset: 0;
  z-index: 1;
  background:
    linear-gradient(180deg,
      rgba(0,0,0,0.55) 0%,
      rgba(0,0,0,0.1) 35%,
      rgba(0,0,0,0.2) 70%,
      rgba(0,0,0,0.65) 100%);
}

/* ── Phone shell ──────────────────────────────────────────── */
.phone-shell {
  position: relative;
  z-index: 10;
  width: 393px;
  height: 852px;
  border-radius: 55px;
  overflow: hidden;
  /* Liquid Glass outer shell */
  backdrop-filter: blur(0px);
  box-shadow:
    inset 0 0 0 1.5px rgba(255,255,255,0.18),
    0 0 0 12px #1a1a1a,
    0 0 0 13.5px rgba(255,255,255,0.1),
    0 0 0 14.5px #111,
    0 70px 200px rgba(0,0,0,0.95),
    0 20px 60px rgba(0,0,0,0.6);
}

.phone-inner {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  background: rgba(0,0,0,0.2);
}

/* ── Status bar ───────────────────────────────────────────── */
.status-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px 28px 0;
  flex-shrink: 0;
  z-index: 20;
}
.status-time { font-size: 15px; font-weight: 600; color: #fff; letter-spacing: -0.3px; }
.status-icons { display: flex; align-items: center; gap: 6px; color: #fff; }

/* ── Dynamic Island ───────────────────────────────────────── */
.di-wrap {
  display: flex;
  justify-content: center;
  margin-top: 10px;
  flex-shrink: 0;
  position: relative;
  z-index: 200;
}

.dynamic-island {
  position: relative;
  width: 126px;
  height: 37px;
  background: #000;
  border-radius: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  overflow: hidden;
  transition: width 0.5s cubic-bezier(0.34,1.2,0.64,1),
              height 0.5s cubic-bezier(0.34,1.2,0.64,1),
              border-radius 0.5s cubic-bezier(0.34,1.2,0.64,1);
  /* Liquid Glass on DI */
  box-shadow:
    inset 0 1px 1px rgba(255,255,255,0.12),
    0 4px 20px rgba(0,0,0,0.5);
}

.dynamic-island.expanded {
  width: 338px;
  height: 86px;
  border-radius: 30px;
}

/* collapsed dots */
.di-dots {
  display: flex;
  align-items: center;
  gap: 7px;
  transition: opacity 0.15s;
}
.di-dots.hidden { opacity: 0; pointer-events: none; position: absolute; }
.di-dot  { width: 7px; height: 7px; background: #111; border-radius: 50%; }
.di-cam  { width: 11px; height: 11px; background: #0a0a0a; border-radius: 50%; border: 1.5px solid #1c1c1e; }

/* music bars (collapsed) */
.di-bars {
  position: absolute;
  right: 14px;
  top: 50%;
  transform: translateY(-50%);
  display: flex;
  gap: 2.5px;
  align-items: flex-end;
  height: 16px;
  opacity: 0;
  transition: opacity 0.3s;
}
.di-bars.show { opacity: 1; }
.di-bar {
  width: 3px;
  background: #ff375f;
  border-radius: 2px;
  animation: barBounce 0.7s ease-in-out infinite alternate;
}
.di-bar:nth-child(1){ animation-delay:0s;   height:6px; }
.di-bar:nth-child(2){ animation-delay:0.18s; height:12px; }
.di-bar:nth-child(3){ animation-delay:0.08s; height:8px; }
@keyframes barBounce {
  from { transform: scaleY(0.35); }
  to   { transform: scaleY(1); }
}

/* expanded content */
.di-expanded {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  padding: 0 14px;
  gap: 12px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s 0.15s;
}
.di-expanded.show { opacity: 1; pointer-events: all; }

.di-art {
  width: 58px; height: 58px;
  border-radius: 11px;
  overflow: hidden;
  flex-shrink: 0;
  box-shadow: 0 4px 16px rgba(0,0,0,0.5);
}
.di-art video { width:100%; height:100%; object-fit:cover; }

.di-meta { flex: 1; min-width: 0; }
.di-title { font-size: 13px; font-weight: 600; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.di-artist { font-size: 11px; color: rgba(255,255,255,0.5); margin-top: 1px; }
.di-pbar { height: 2px; background: rgba(255,255,255,0.15); border-radius: 1px; margin-top: 7px; }
.di-pfill { height: 100%; background: rgba(255,255,255,0.6); border-radius: 1px; width: 0%; transition: width 0.3s linear; }

.di-ctls { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.di-ctl-btn {
  background: none; border: none; cursor: pointer; color: #fff;
  display: flex; align-items: center; justify-content: center;
  transition: transform 0.1s, opacity 0.1s;
}
.di-ctl-btn:active { transform: scale(0.85); opacity: 0.6; }
.di-ctl-btn.dim { color: rgba(255,255,255,0.55); }

/* ── Screen content ───────────────────────────────────────── */
.screen { flex: 1; display: flex; flex-direction: column; padding: 14px 28px 0; overflow: hidden; }

/* ── Artwork ──────────────────────────────────────────────── */
.artwork-wrap {
  position: relative;
  width: 100%;
  aspect-ratio: 1;
  border-radius: 22px;
  overflow: hidden;
  margin-bottom: 22px;
  flex-shrink: 0;
  box-shadow:
    0 0 0 0.5px rgba(255,255,255,0.1),
    0 30px 80px rgba(0,0,0,0.7),
    0 10px 30px rgba(0,0,0,0.4);
  transform: scale(1);
  transition: transform 0.5s cubic-bezier(0.34,1.4,0.64,1);
}
.artwork-wrap.playing { transform: scale(1.04); }
.artwork-wrap video { width:100%; height:100%; object-fit:cover; display:block; }

/* Glass sheen overlay on artwork */
.artwork-wrap::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg,
    rgba(255,255,255,0.08) 0%,
    transparent 45%,
    rgba(0,0,0,0.12) 100%);
  pointer-events: none;
}

/* ── Liquid Glass element ─────────────────────────────────── */
/* Applies authentic Apple Liquid Glass via layered backdrop-filter + SVG distortion */
.liqglass {
  position: relative;
  isolation: isolate;
  backdrop-filter: blur(32px) saturate(1.9) brightness(1.08);
  -webkit-backdrop-filter: blur(32px) saturate(1.9) brightness(1.08);
  background: rgba(255,255,255,0.07);
  border: 1px solid rgba(255,255,255,0.22);
  border-bottom-color: rgba(255,255,255,0.06);
  border-right-color: rgba(255,255,255,0.06);
}
.liqglass::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background: linear-gradient(
    130deg,
    rgba(255,255,255,0.16) 0%,
    rgba(255,255,255,0.05) 35%,
    transparent 55%,
    rgba(255,255,255,0.03) 100%
  );
  pointer-events: none;
  z-index: 0;
}
.liqglass::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: inherit;
  box-shadow:
    inset 0 1.5px 1px rgba(255,255,255,0.3),
    inset 0 -1px 1px rgba(0,0,0,0.08),
    inset 1.5px 0 1px rgba(255,255,255,0.14),
    0 8px 32px rgba(0,0,0,0.28);
  pointer-events: none;
  z-index: 0;
}

/* ── Track info ───────────────────────────────────────────── */
.track-info {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
}
.track-text .title {
  font-size: 22px; font-weight: 700; color: #fff;
  letter-spacing: -0.5px; line-height: 1.15;
}
.track-text .artist {
  font-size: 15px; font-weight: 500;
  color: rgba(255,255,255,0.58); margin-top: 2px;
}
.track-actions { display: flex; gap: 6px; }

.icon-btn {
  background: none; border: none; cursor: pointer;
  color: rgba(255,255,255,0.5);
  padding: 6px; display: flex; align-items: center; justify-content: center;
  transition: color 0.15s, transform 0.1s; border-radius: 50%;
}
.icon-btn:hover { color: rgba(255,255,255,0.9); }
.icon-btn:active { transform: scale(0.88); }
.icon-btn.liked { color: #ff3b5c; }
.icon-btn.liked path { fill: currentColor; }

/* ── Progress ─────────────────────────────────────────────── */
.progress-wrap { margin-bottom: 20px; }

.progress-track {
  position: relative;
  height: 4.5px;
  background: rgba(255,255,255,0.16);
  border-radius: 3px;
  cursor: pointer;
  margin-bottom: 7px;
}
.progress-fill {
  height: 100%;
  background: #fff;
  border-radius: 3px;
  width: 0%;
  position: relative;
  transition: width 0.1s linear;
}
.progress-thumb {
  position: absolute;
  right: -7px; top: 50%;
  transform: translateY(-50%) scale(0);
  width: 14px; height: 14px;
  background: #fff; border-radius: 50%;
  box-shadow: 0 2px 8px rgba(0,0,0,0.35);
  transition: transform 0.18s;
}
.progress-track:hover .progress-thumb,
.progress-track.active .progress-thumb { transform: translateY(-50%) scale(1); }

.time-row {
  display: flex;
  justify-content: space-between;
  font-size: 11px; font-weight: 500;
  color: rgba(255,255,255,0.38); letter-spacing: 0.2px;
}

/* ── Controls ─────────────────────────────────────────────── */
.controls {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 8px;
  margin-bottom: 22px;
}
.ctrl-btn {
  background: none; border: none; cursor: pointer;
  color: rgba(255,255,255,0.85);
  display: flex; align-items: center; justify-content: center;
  transition: transform 0.12s, opacity 0.12s;
  padding: 4px; border-radius: 50%;
}
.ctrl-btn:hover { opacity: 0.65; }
.ctrl-btn:active { transform: scale(0.88); }

.play-btn {
  width: 68px; height: 68px;
  background: rgba(255,255,255,0.93);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  color: #000;
  border: none; cursor: pointer;
  /* Liquid Glass on play button */
  box-shadow:
    inset 0 1.5px 1px rgba(255,255,255,0.6),
    inset 0 -1px 1px rgba(0,0,0,0.1),
    0 6px 28px rgba(0,0,0,0.45),
    0 2px 8px rgba(255,255,255,0.1);
  transition: transform 0.15s, box-shadow 0.15s;
}
.play-btn:hover { transform: scale(1.05); }
.play-btn:active { transform: scale(0.92); }

.play-icon, .pause-icon { display: none; }
.play-icon.on, .pause-icon.on { display: block; }

/* ── Volume ───────────────────────────────────────────────── */
.vol-row {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 22px;
}
.vol-row svg { color: rgba(255,255,255,0.38); flex-shrink: 0; }
.vol-track {
  flex: 1; height: 4.5px;
  background: rgba(255,255,255,0.16);
  border-radius: 3px; cursor: pointer; position: relative;
}
.vol-fill {
  height: 100%;
  background: rgba(255,255,255,0.6);
  border-radius: 3px; width: 70%;
}

/* ── Bottom nav ───────────────────────────────────────────── */
.bottom-nav {
  display: flex; justify-content: space-around; align-items: center;
  padding: 0 12px 4px;
}
.nav-btn {
  background: none; border: none; cursor: pointer;
  color: rgba(255,255,255,0.38);
  padding: 8px 12px;
  transition: color 0.15s;
  border-radius: 12px;
}
.nav-btn:hover { color: rgba(255,255,255,0.7); }
.nav-btn.on { color: #fff; }

.home-bar-wrap { display: flex; justify-content: center; padding: 6px 0 8px; }
.home-bar { width: 134px; height: 5px; background: rgba(255,255,255,0.32); border-radius: 3px; }

/* ── Responsive ───────────────────────────────────────────── */
@media (max-width: 599px) {
  .phone-shell {
    width: 100vw;
    height: 100dvh;
    border-radius: 0;
    box-shadow: none;
  }
}

@media (min-width: 600px) and (max-height: 900px) {
  .phone-shell { transform: scale(0.9); margin: -44px; }
}
@media (min-width: 600px) and (max-height: 800px) {
  .phone-shell { transform: scale(0.82); margin: -80px; }
}
@media (min-width: 600px) and (max-height: 720px) {
  .phone-shell { transform: scale(0.74); margin: -110px; }
}

/* small mobile height */
@media (max-width: 599px) and (max-height: 700px) {
  .screen { padding: 8px 22px 0; }
  .artwork-wrap { margin-bottom: 14px; }
  .track-text .title { font-size: 19px; }
  .progress-wrap { margin-bottom: 14px; }
  .controls { margin-bottom: 14px; }
  .vol-row { margin-bottom: 14px; }
  .play-btn { width: 60px; height: 60px; }
}

audio { display: none; }
</style>
</head>

<audio id="audio"
  src="https://res.cloudinary.com/dhx58lnzb/video/upload/v1771900933/Assumptions_mhq8co.mp3"
  preload="auto"></audio>

<script>
/* ── References ──────────────────────────────────────────────── */
const audio   = document.getElementById('audio');
const artWrap = document.getElementById('artWrap');

const mainPlay = document.getElementById('mainPlay');
const mainPI   = document.getElementById('mainPI');
const mainPaI  = document.getElementById('mainPaI');

const progTrack = document.getElementById('progTrack');
const progFill  = document.getElementById('progFill');
const curTime   = document.getElementById('curTime');
const totTime   = document.getElementById('totTime');

const volTrack  = document.getElementById('volTrack');
const volFill   = document.getElementById('volFill');

const likeBtn   = document.getElementById('likeBtn');
const clockEl   = document.getElementById('statusClock');

// DI
const di       = document.getElementById('di');
const diDots   = document.getElementById('diDots');
const diBars   = document.getElementById('diBars');
const diExp    = document.getElementById('diExp');
const diPFill  = document.getElementById('diPFill');
const diPlayBtn= document.getElementById('diPlayBtn');
const diPI     = document.getElementById('diPI');
const diPaI    = document.getElementById('diPaI');
const diNext   = document.getElementById('diNext');

/* ── State ───────────────────────────────────────────────────── */
let playing    = false;
let duration   = 220;
let diOpen     = false;
let diTimer    = null;

/* ── Clock ───────────────────────────────────────────────────── */
function tickClock() {
  const n = new Date();
  clockEl.textContent = `${n.getHours()}:${String(n.getMinutes()).padStart(2,'0')}`;
}
tickClock();
setInterval(tickClock, 15000);

/* ── Helpers ─────────────────────────────────────────────────── */
function fmt(s) {
  return `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
}

function setPlaying(v) {
  playing = v;
  // main controls
  mainPI.classList.toggle('on', !v);
  mainPaI.classList.toggle('on', v);
  // DI controls
  diPI.classList.toggle('on', !v);
  diPaI.classList.toggle('on', v);
  // artwork scale
  artWrap.classList.toggle('playing', v);
  // DI bars
  diBars.classList.toggle('show', v);
}

/* ── Play / Pause ────────────────────────────────────────────── */
function togglePlay() {
  if (playing) { audio.pause(); setPlaying(false); }
  else         { audio.play(); setPlaying(true); }
}

mainPlay.addEventListener('click', togglePlay);

/* ── Seek buttons ────────────────────────────────────────────── */
document.getElementById('btnBack').addEventListener('click', () => {
  audio.currentTime = Math.max(0, audio.currentTime - 15);
});
document.getElementById('btnFwd').addEventListener('click', () => {
  audio.currentTime = Math.min(audio.duration || duration, audio.currentTime + 15);
});

/* ── Time update ─────────────────────────────────────────────── */
audio.addEventListener('timeupdate', () => {
  const d   = audio.duration || duration;
  const pct = (audio.currentTime / d) * 100;
  progFill.style.width = pct + '%';
  diPFill.style.width  = pct + '%';
  curTime.textContent  = fmt(audio.currentTime);
  totTime.textContent  = fmt(d);
});

audio.addEventListener('loadedmetadata', () => {
  duration = audio.duration;
  totTime.textContent = fmt(duration);
});

audio.addEventListener('ended', () => {
  setPlaying(false);
  audio.currentTime = 0;
});

/* ── Progress scrub (mouse + touch) ─────────────────────────── */
let scrub = false;
function doScrub(e) {
  const rect = progTrack.getBoundingClientRect();
  const cx   = e.touches ? e.touches[0].clientX : e.clientX;
  const x    = Math.max(0, Math.min(cx - rect.left, rect.width));
  audio.currentTime = (x / rect.width) * (audio.duration || duration);
}
progTrack.addEventListener('mousedown',  e => { scrub = true; progTrack.classList.add('active'); doScrub(e); });
progTrack.addEventListener('touchstart', e => { scrub = true; progTrack.classList.add('active'); doScrub(e); }, { passive: true });
document.addEventListener('mousemove',  e => { if (scrub) doScrub(e); });
document.addEventListener('touchmove',  e => { if (scrub) doScrub(e); }, { passive: true });
document.addEventListener('mouseup',    () => { scrub = false; progTrack.classList.remove('active'); });
document.addEventListener('touchend',   () => { scrub = false; progTrack.classList.remove('active'); });

/* ── Volume scrub ────────────────────────────────────────────── */
audio.volume = 0.7;
let vdrag = false;
function doVol(e) {
  const rect = volTrack.getBoundingClientRect();
  const cx   = e.touches ? e.touches[0].clientX : e.clientX;
  const vol  = Math.max(0, Math.min((cx - rect.left) / rect.width, 1));
  audio.volume = vol;
  volFill.style.width = (vol * 100) + '%';
}
volTrack.addEventListener('mousedown',  e => { vdrag = true; doVol(e); });
volTrack.addEventListener('touchstart', e => { vdrag = true; doVol(e); }, { passive: true });
document.addEventListener('mousemove',  e => { if (vdrag) doVol(e); });
document.addEventListener('touchmove',  e => { if (vdrag) doVol(e); }, { passive: true });
document.addEventListener('mouseup',    () => { vdrag = false; });
document.addEventListener('touchend',   () => { vdrag = false; });

/* ── Like ────────────────────────────────────────────────────── */
likeBtn.addEventListener('click', () => {
  likeBtn.classList.toggle('liked');
  likeBtn.querySelector('path')
    .setAttribute('fill', likeBtn.classList.contains('liked') ? 'currentColor' : 'none');
});

/* ── Dynamic Island ──────────────────────────────────────────── */
function openDI() {
  if (diOpen) return;
  diOpen = true;
  di.classList.add('expanded');
  diDots.classList.add('hidden');
  diExp.classList.add('show');
  resetDITimer();
}

function closeDI() {
  if (!diOpen) return;
  diOpen = false;
  di.classList.remove('expanded');
  diExp.classList.remove('show');
  setTimeout(() => { if (!diOpen) diDots.classList.remove('hidden'); }, 350);
  if (diTimer) { clearTimeout(diTimer); diTimer = null; }
}

function resetDITimer() {
  if (diTimer) clearTimeout(diTimer);
  diTimer = setTimeout(closeDI, 5500);
}

di.addEventListener('click', e => {
  e.stopPropagation();
  diOpen ? closeDI() : openDI();
});

document.addEventListener('click', () => { if (diOpen) closeDI(); });

diPlayBtn.addEventListener('click', e => {
  e.stopPropagation();
  togglePlay();
  resetDITimer();
});

diNext.addEventListener('click', e => {
  e.stopPropagation();
  audio.currentTime = 0;
  if (!playing) { audio.play(); setPlaying(true); }
  resetDITimer();
});

audio.addEventListener('play', openDI);
</script>
</body>
</html>
